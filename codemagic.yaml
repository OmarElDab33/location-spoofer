workflows:
  ios-location-spoofer:
    name: Location Spoofer iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: tg.tgqq1504.tool9

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Build Go core
        script: |
          chmod +x Scripts/build-core.sh
          ./Scripts/build-core.sh

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -o pipefail
      
          xcodebuild \
            -project "$CM_BUILD_DIR/PaopaoLocationSpoofer.xcodeproj" \
            -scheme "PaopaoLocationSpoofer" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/PaopaoLocationSpoofer.xcarchive" \
            DEVELOPMENT_TEAM=H2VEZL5XEB \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            archive \
            2>&1 | tee "$CM_BUILD_DIR/xcode-archive.log"
      
      artifacts:
        - "**/*.ipa"
        - "xcode-archive.log"
